spring.application.name=pedidos-service
server.port=8083
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://127.0.0.1:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:127.0.0.1}
