spring.application.name=config-server
server.port=${PORT:8888}
spring.profiles.active=${CONFIG_BACKEND:native}
spring.cloud.config.server.native.search-locations=file:../config-repo/
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/example/config-tienda.git}
spring.cloud.config.server.git.default-label=${CONFIG_GIT_BRANCH:main}
spring.cloud.config.server.git.search-paths=${CONFIG_GIT_SEARCH_PATHS:config-repo}
