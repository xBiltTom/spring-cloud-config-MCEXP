<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="aB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/></marker>
    <marker id="aO" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ea580c"/></marker>
    <marker id="aG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#16a34a"/></marker>
    <marker id="aP" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7c3aed"/></marker>
    <marker id="aK" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#374151"/></marker>
  </defs>
  <rect width="1500" height="1040" fill="#f8fafc"/>
  <text x="750" y="36" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">Arquitectura: Config Server + Eureka + API Gateway + Microservicios</text>

  <!-- GitHub -->
  <rect x="100" y="70" width="260" height="110" rx="12" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="230" y="105" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">GitHub</text>
  <text x="230" y="130" text-anchor="middle" font-size="14" fill="#374151">config-repo/</text>
  <text x="230" y="150" text-anchor="middle" font-size="12" fill="#374151">productos|clientes|pedidos-service</text>
  <text x="230" y="167" text-anchor="middle" font-size="12" fill="#374151">.properties  (mensaje=...)</text>

  <!-- Config Server -->
  <rect x="550" y="70" width="300" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="700" y="105" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e3a8a">Config Server</text>
  <text x="700" y="130" text-anchor="middle" font-size="14" fill="#1e3a8a">:8888 (Render usa $PORT)</text>
  <text x="700" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">@EnableConfigServer</text>
  <text x="700" y="167" text-anchor="middle" font-size="12" fill="#1e3a8a">backend git (Render) / native (local)</text>

  <!-- Eureka -->
  <rect x="1240" y="420" width="220" height="120" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="1350" y="458" text-anchor="middle" font-size="19" font-weight="bold" fill="#9a3412">Eureka Server</text>
  <text x="1350" y="483" text-anchor="middle" font-size="14" fill="#9a3412">:8761</text>
  <text x="1350" y="505" text-anchor="middle" font-size="12" fill="#9a3412">registro de servicios</text>
  <text x="1350" y="522" text-anchor="middle" font-size="12" fill="#9a3412">(nombre → IP:puerto)</text>

  <!-- Servicios -->
  <g font-size="19" font-weight="bold">
    <rect x="100" y="420" width="260" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="230" y="458" text-anchor="middle" fill="#14532d">productos-service</text>
    <text x="230" y="483" text-anchor="middle" font-size="14" font-weight="normal" fill="#14532d">:8081</text>
    <text x="230" y="505" text-anchor="middle" font-size="12" font-weight="normal" fill="#14532d">GET /mensaje → @Value("${mensaje}")</text>

    <rect x="500" y="420" width="260" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="630" y="458" text-anchor="middle" fill="#14532d">clientes-service</text>
    <text x="630" y="483" text-anchor="middle" font-size="14" font-weight="normal" fill="#14532d">:8082</text>
    <text x="630" y="505" text-anchor="middle" font-size="12" font-weight="normal" fill="#14532d">GET /mensaje → @Value("${mensaje}")</text>

    <rect x="900" y="420" width="260" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1030" y="458" text-anchor="middle" fill="#14532d">pedidos-service</text>
    <text x="1030" y="483" text-anchor="middle" font-size="14" font-weight="normal" fill="#14532d">:8083</text>
    <text x="1030" y="505" text-anchor="middle" font-size="12" font-weight="normal" fill="#14532d">GET /mensaje → @Value("${mensaje}")</text>
  </g>

  <!-- Usuario -->
  <rect x="100" y="710" width="200" height="80" rx="12" fill="#fff" stroke="#374151" stroke-width="2"/>
  <text x="200" y="745" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">Usuario</text>
  <text x="200" y="768" text-anchor="middle" font-size="12" fill="#374151">navegador / curl</text>

  <!-- Gateway -->
  <rect x="480" y="700" width="300" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="630" y="735" text-anchor="middle" font-size="19" font-weight="bold" fill="#4c1d95">API Gateway :8080</text>
  <text x="630" y="758" text-anchor="middle" font-size="12" fill="#4c1d95">/productos/** /clientes/** /pedidos/**</text>
  <text x="630" y="777" text-anchor="middle" font-size="12" fill="#4c1d95">lb://nombre-servicio + StripPrefix=1</text>

  <!-- ① GitHub -> Config Server -->
  <line x1="360" y1="125" x2="548" y2="125" stroke="#374151" stroke-width="3" marker-end="url(#aK)"/>
  <circle cx="454" cy="125" r="15" fill="#374151"/><text x="454" y="131" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
  <text x="454" y="100" text-anchor="middle" font-size="12" fill="#374151">git clone / pull</text>

  <!-- ② Servicios -> Config Server (dashed blue) -->
  <g stroke="#2563eb" stroke-width="3" stroke-dasharray="9,6" fill="none">
    <line x1="200" y1="420" x2="636" y2="182" marker-end="url(#aB)"/>
    <line x1="610" y1="420" x2="700" y2="182" marker-end="url(#aB)"/>
    <line x1="1000" y1="420" x2="764" y2="182" marker-end="url(#aB)"/>
  </g>
  <circle cx="590" cy="300" r="15" fill="#2563eb"/><text x="590" y="306" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
  <text x="250" y="300" font-size="12" fill="#1e3a8a">GET /{nombre}/default</text>
  <text x="250" y="316" font-size="12" fill="#1e3a8a">(al arrancar → recibe "mensaje")</text>

  <!-- ③ Registro en Eureka (bus naranja) -->
  <g stroke="#ea580c" stroke-width="3" stroke-dasharray="9,6" fill="none">
    <path d="M300,420 V350 H1350 V418" marker-end="url(#aO)"/>
    <path d="M700,420 V350"/>
    <path d="M1100,420 V350"/>
  </g>
  <circle cx="1220" cy="350" r="15" fill="#ea580c"/><text x="1220" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
  <text x="1210" y="332" text-anchor="end" font-size="12" fill="#9a3412">se registran (EUREKA_ENABLED=true) con su spring.application.name</text>

  <!-- ④ Usuario -> Gateway -->
  <line x1="300" y1="750" x2="478" y2="750" stroke="#111827" stroke-width="3" marker-end="url(#aK)"/>
  <circle cx="389" cy="750" r="15" fill="#111827"/><text x="389" y="756" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">4</text>
  <text x="389" y="722" text-anchor="middle" font-size="12" fill="#111827">GET /productos/mensaje</text>

  <!-- ⑤ Gateway -> Eureka (consulta) -->
  <path d="M780,765 H1350 V542" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9,6" marker-end="url(#aP)"/>
  <circle cx="1090" cy="765" r="15" fill="#7c3aed"/><text x="1090" y="771" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">5</text>
  <text x="1090" y="742" text-anchor="middle" font-size="12" fill="#4c1d95">¿dónde está productos-service?</text>

  <!-- ⑥ Gateway -> servicios (verde) -->
  <g stroke="#16a34a" stroke-width="3" fill="none">
    <line x1="540" y1="700" x2="260" y2="542" marker-end="url(#aG)"/>
    <line x1="630" y1="700" x2="630" y2="542" marker-end="url(#aG)"/>
    <line x1="720" y1="700" x2="1000" y2="542" marker-end="url(#aG)"/>
  </g>
  <circle cx="630" cy="620" r="15" fill="#16a34a"/><text x="630" y="626" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">6</text>
  <text x="250" y="640" font-size="12" fill="#14532d">reenvía GET /mensaje</text>
  <text x="250" y="656" font-size="12" fill="#14532d">(sin el prefijo /productos)</text>

  <!-- Leyenda -->
  <rect x="60" y="850" width="1380" height="170" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="882" font-size="16" font-weight="bold" fill="#111827">Al arrancar (una vez)</text>
  <text x="90" y="908" font-size="14" fill="#374151">1. Config Server lee los .properties desde GitHub (config-repo/).</text>
  <text x="90" y="930" font-size="14" fill="#374151">2. Cada microservicio pide su configuración al Config Server según su nombre.</text>
  <text x="90" y="952" font-size="14" fill="#374151">3. Cada microservicio se registra en Eureka (opcional, por variable de entorno).</text>
  <text x="90" y="990" font-size="13" fill="#6b7280">Los servicios no se llaman entre sí: solo devuelven su "mensaje".</text>
  <text x="780" y="882" font-size="16" font-weight="bold" fill="#111827">En cada petición</text>
  <text x="780" y="908" font-size="14" fill="#374151">4. El usuario llama al Gateway (:8080), p. ej. /productos/mensaje.</text>
  <text x="780" y="930" font-size="14" fill="#374151">5. El Gateway pregunta a Eureka dónde está productos-service.</text>
  <text x="780" y="952" font-size="14" fill="#374151">6. El Gateway reenvía GET /mensaje al servicio, que responde con el valor</text>
  <text x="780" y="972" font-size="14" fill="#374151">    leído del Config Server.</text>
</svg>
